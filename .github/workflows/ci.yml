name: "Build and Test"

on: [push, pull_request]

jobs:
  build:
    name: Setup&Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make libgtest-dev g++-11 libopenblas-dev liblapacke-dev libeigen3-dev
          sudo ln -sf /usr/bin/g++-11 /usr/bin/g++
          sudo ln -sf /usr/include/eigen3/Eigen /usr/include/Eigen

      - name: Build
        run: |
          make
      - name: Test
        run: |
          make test